<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>セットアップウィザード｜ホットペッパー予約通知ツール</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', 'Meiryo', sans-serif;
  background: #f5f5f7;
  color: #1d1d1f;
  line-height: 1.6;
  min-height: 100vh;
}

/* ==== レイアウト ==== */
.app {
  display: grid;
  grid-template-columns: 280px 1fr;
  min-height: 100vh;
}
@media (max-width: 800px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { position: sticky; top: 0; z-index: 10; }
}

/* ==== サイドバー ==== */
.sidebar {
  background: linear-gradient(180deg, #c44569 0%, #6c3483 100%);
  color: white;
  padding: 24px 20px;
}
.sidebar h1 {
  font-size: 18px;
  margin-bottom: 4px;
}
.sidebar .sub {
  font-size: 12px;
  opacity: 0.8;
  margin-bottom: 24px;
}
.progress {
  background: rgba(255,255,255,0.15);
  height: 6px;
  border-radius: 3px;
  overflow: hidden;
  margin-bottom: 20px;
}
.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, #ffd54f, #ff8a65);
  transition: width 0.3s;
}
.steps {
  list-style: none;
}
.steps li {
  padding: 10px 12px;
  border-radius: 8px;
  margin-bottom: 4px;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 10px;
}
.steps li:hover { background: rgba(255,255,255,0.1); }
.steps li.active {
  background: rgba(255,255,255,0.25);
  font-weight: bold;
}
.steps li.done { opacity: 0.7; }
.steps li.done::before { content: '✓'; color: #80ff80; font-weight: bold; }
.steps li:not(.done)::before { content: counter(s); }
.steps { counter-reset: s; }
.steps li:not(.done) { counter-increment: s; }
.steps li:not(.done)::before {
  background: rgba(255,255,255,0.2);
  width: 22px; height: 22px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: bold;
}
.sidebar-foot {
  margin-top: 30px;
  padding-top: 20px;
  border-top: 1px solid rgba(255,255,255,0.2);
  font-size: 12px;
  opacity: 0.8;
}
.sidebar-foot button {
  background: rgba(255,255,255,0.1);
  color: white;
  border: 1px solid rgba(255,255,255,0.3);
  padding: 6px 10px;
  border-radius: 6px;
  font-size: 11px;
  cursor: pointer;
  margin-top: 8px;
}
.sidebar-foot button:hover { background: rgba(255,255,255,0.2); }

/* ==== メイン ==== */
.main {
  padding: 40px 60px;
  overflow-y: auto;
  max-height: 100vh;
}
@media (max-width: 800px) {
  .main { padding: 24px 20px; max-height: none; }
}
.step-content { max-width: 800px; margin: 0 auto; }
.step-content h2 {
  font-size: 28px;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.step-content .step-meta {
  color: #888;
  font-size: 13px;
  margin-bottom: 24px;
  display: flex;
  gap: 16px;
}
.step-content .step-meta span::before {
  margin-right: 4px;
}
.step-content .lead {
  font-size: 15px;
  color: #555;
  margin-bottom: 24px;
  padding-bottom: 16px;
  border-bottom: 1px solid #eee;
}

/* ==== カード ==== */
.card {
  background: white;
  border-radius: 12px;
  padding: 20px 24px;
  margin-bottom: 16px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}
.card.numbered { padding-left: 64px; position: relative; }
.card-num {
  position: absolute;
  left: 16px;
  top: 18px;
  background: linear-gradient(135deg, #ff6b9d, #c44569);
  color: white;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  font-size: 14px;
  box-shadow: 0 2px 6px rgba(196,69,105,0.3);
}
.card h3 {
  font-size: 17px;
  margin-bottom: 8px;
}
.card p {
  font-size: 14px;
  color: #555;
  margin-bottom: 8px;
}
.card p:last-child { margin-bottom: 0; }

/* ==== ボタン ==== */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 10px 18px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  border: none;
  text-decoration: none;
  transition: all 0.15s;
  margin: 4px 4px 4px 0;
}
.btn-primary {
  background: linear-gradient(135deg, #ff6b9d, #c44569);
  color: white;
  box-shadow: 0 2px 8px rgba(196,69,105,0.3);
}
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(196,69,105,0.4); }
.btn-link {
  background: #007aff;
  color: white;
}
.btn-link:hover { background: #0056b3; }
.btn-copy {
  background: #34c759;
  color: white;
}
.btn-copy:hover { background: #248a3d; }
.btn-copy.copied { background: #248a3d; }
.btn-secondary {
  background: white;
  color: #555;
  border: 1px solid #ddd;
}
.btn-secondary:hover { background: #f5f5f7; }
.btn-large { padding: 14px 28px; font-size: 16px; }

/* ==== コードブロック ==== */
.code-block {
  background: #1e1e1e;
  color: #dcdcdc;
  padding: 16px;
  border-radius: 8px;
  font-family: 'SF Mono', Menlo, Monaco, Consolas, monospace;
  font-size: 12px;
  line-height: 1.7;
  overflow-x: auto;
  position: relative;
  margin: 12px 0;
  white-space: pre;
}
.code-block.highlight-bg { background: #fff8dc; color: #1e1e1e; }
.code-block-wrap { position: relative; }
.code-block-copy {
  position: absolute;
  top: 8px;
  right: 8px;
  font-size: 11px;
  padding: 6px 12px;
  z-index: 5;
}

/* ==== 入力 ==== */
.input-group { margin: 12px 0; }
.input-group label {
  display: block;
  font-size: 13px;
  font-weight: bold;
  margin-bottom: 6px;
  color: #444;
}
.input-group input,
.input-group textarea {
  width: 100%;
  padding: 10px 14px;
  border: 2px solid #e0e0e0;
  border-radius: 8px;
  font-size: 14px;
  font-family: inherit;
  transition: border-color 0.15s;
}
.input-group input:focus,
.input-group textarea:focus {
  outline: none;
  border-color: #ff6b9d;
}
.input-group input.valid { border-color: #34c759; background: #f0fff4; }
.input-group input.invalid { border-color: #ff3b30; background: #fff5f5; }
.input-hint {
  font-size: 11px;
  color: #888;
  margin-top: 4px;
}
.input-hint.error { color: #ff3b30; }

/* ==== Alerts ==== */
.alert {
  padding: 12px 16px;
  border-radius: 8px;
  margin: 12px 0;
  font-size: 14px;
}
.alert-warn { background: #fff3cd; border-left: 4px solid #ffc107; color: #856404; }
.alert-warn::before { content: '⚠️ '; font-weight: bold; }
.alert-tip { background: #d1ecf1; border-left: 4px solid #17a2b8; color: #0c5460; }
.alert-tip::before { content: '💡 '; font-weight: bold; }
.alert-success { background: #d4edda; border-left: 4px solid #28a745; color: #155724; }
.alert-success::before { content: '✅ '; font-weight: bold; }
.alert-error { background: #f8d7da; border-left: 4px solid #dc3545; color: #721c24; }
.alert-error::before { content: '❌ '; font-weight: bold; }

/* ==== ナビ ==== */
.nav-buttons {
  display: flex;
  justify-content: space-between;
  margin-top: 32px;
  padding-top: 24px;
  border-top: 1px solid #eee;
}

/* ==== チェックリスト ==== */
.checklist label {
  display: flex;
  align-items: center;
  padding: 8px 0;
  font-size: 14px;
  cursor: pointer;
}
.checklist input[type=checkbox] {
  width: 18px;
  height: 18px;
  margin-right: 10px;
  cursor: pointer;
}
.checklist input:checked + span { text-decoration: line-through; opacity: 0.6; }

/* ==== トーク ==== */
.talk {
  background: #fff8e1;
  border: 2px dashed #ffc107;
  border-radius: 12px;
  padding: 16px 20px;
  margin: 12px 0;
  position: relative;
}
.talk::before {
  content: '🗣 こう言う';
  position: absolute;
  top: -10px;
  left: 12px;
  background: #ffc107;
  color: white;
  font-size: 11px;
  padding: 2px 10px;
  border-radius: 10px;
  font-weight: bold;
}
.talk-text {
  font-size: 14px;
  color: #5d4037;
  margin-top: 6px;
  font-style: italic;
}

/* ==== ステップヘッダー特別装飾 ==== */
.hero-card {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  border-radius: 12px;
  padding: 32px;
  margin-bottom: 24px;
}
.hero-card h2 { font-size: 28px; margin-bottom: 8px; color: white; }
.hero-card p { color: rgba(255,255,255,0.9); font-size: 15px; }

.welcome-features {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px;
  margin-top: 20px;
}
.welcome-feature {
  background: rgba(255,255,255,0.15);
  padding: 12px 16px;
  border-radius: 8px;
  font-size: 13px;
  backdrop-filter: blur(10px);
}

/* ==== 完了画面 ==== */
.celebration {
  text-align: center;
  padding: 40px 20px;
}
.celebration .emoji { font-size: 80px; margin-bottom: 20px; }
.celebration h2 { font-size: 32px; color: #c44569; margin-bottom: 12px; }
.celebration p { font-size: 16px; color: #555; margin-bottom: 24px; }

/* ==== ファイル選択タブ ==== */
.file-tabs {
  display: flex;
  gap: 4px;
  margin-bottom: 0;
  border-bottom: 2px solid #e0e0e0;
}
.file-tabs button {
  background: none;
  border: none;
  padding: 8px 14px;
  cursor: pointer;
  font-size: 13px;
  font-weight: bold;
  color: #888;
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  transition: all 0.15s;
  font-family: monospace;
}
.file-tabs button.active {
  color: #c44569;
  border-bottom-color: #c44569;
}

.hidden { display: none !important; }

/* ==== サイト選択カード（STEP 2） ==== */
.site-check-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 10px;
  margin: 12px 0 4px;
}
.site-check-card {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 12px 14px;
  border: 2px solid #e5e7eb;
  border-radius: 10px;
  cursor: pointer;
  background: white;
  transition: all 0.15s;
  user-select: none;
}
.site-check-card:hover {
  border-color: #c44569;
  background: #fff7fa;
}
.site-check-card.checked {
  border-color: #c44569;
  background: #fff0f5;
  box-shadow: 0 1px 4px rgba(196,69,105,0.12);
}
.site-check-card input[type="checkbox"] {
  margin: 3px 0 0 0;
  width: 18px;
  height: 18px;
  flex-shrink: 0;
  cursor: pointer;
  accent-color: #c44569;
}
.site-check-card .site-name {
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 4px;
  line-height: 1.4;
}
.site-check-card .site-domains {
  font-size: 11px;
  color: #888;
  font-family: 'SF Mono', Menlo, Monaco, Consolas, monospace;
  line-height: 1.6;
}
.site-check-card .site-body { flex: 1; min-width: 0; }
.site-check-card .site-name.hotpepper { color: #e60039; }
.site-check-card .site-name.rakuten   { color: #bf0000; }
.site-check-card .site-name.minimo    { color: #00a86b; }
.site-check-card .site-name.epark     { color: #0a7cff; }

.from-input-wrap input.flash {
  background: #fffbe5 !important;
  transition: background 0.6s;
}

/* ==== サイト行リスト（STEP 2 改）==== */
.site-row-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-top: 12px;
}
.site-row {
  border: 2px solid #e5e7eb;
  border-radius: 12px;
  background: white;
  overflow: hidden;
  transition: border-color 0.2s, background 0.2s;
}
.site-row.checked {
  border-color: #c44569;
  background: linear-gradient(180deg, #fff7fa, white);
  box-shadow: 0 1px 4px rgba(196,69,105,0.1);
}
.site-row-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 18px;
  cursor: pointer;
  user-select: none;
}
.site-row.checked .site-row-header {
  border-bottom: 1px dashed rgba(196,69,105,0.3);
}
.site-row-header input[type="checkbox"] {
  width: 20px; height: 20px;
  margin: 0;
  flex-shrink: 0;
  cursor: pointer;
  accent-color: #c44569;
}
.site-row-header .site-body { flex: 1; }
.site-row-header .site-name {
  font-size: 15px;
  font-weight: 800;
  margin-bottom: 2px;
}
.site-row-header .site-name.hotpepper { color: #e60039; }
.site-row-header .site-name.rakuten   { color: #bf0000; }
.site-row-header .site-name.minimo    { color: #00a86b; }
.site-row-header .site-name.epark     { color: #0a7cff; }
.site-row-header .site-tag {
  font-size: 11px;
  color: #888;
  letter-spacing: 0.05em;
}

/* チェック時のみ展開して入力欄表示 */
.site-input-wrap {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.3s, padding 0.3s;
  padding: 0 18px;
}
.site-row.checked .site-input-wrap {
  max-height: 200px;
  padding: 14px 18px 18px 50px;
  background: white;
}
.site-input-label {
  display: block;
  font-size: 11px;
  font-weight: 700;
  color: #666;
  margin-bottom: 6px;
  letter-spacing: 0.05em;
}
.site-input {
  width: 100%;
  padding: 10px 14px;
  border: 1.5px solid #ddd;
  border-radius: 8px;
  font-family: 'SF Mono', Menlo, Monaco, Consolas, monospace;
  font-size: 13px;
  background: white;
  transition: border-color 0.15s, background 0.4s;
}
.site-input:focus {
  outline: none;
  border-color: #c44569;
}
.site-input.flash { background: #fffbe5; }
.site-input-hint {
  font-size: 11px;
  color: #999;
  margin-top: 6px;
  letter-spacing: 0.02em;
}
</style>
</head>
<body>

<div class="app">
  <!-- ==== サイドバー ==== -->
  <aside class="sidebar">
    <h1>🌸 セットアップウィザード</h1>
    <div class="sub">ホットペッパー予約通知ツール</div>

    <div class="progress"><div class="progress-bar" id="progress-bar" style="width: 0%"></div></div>

    <ul class="steps" id="step-list">
      <li data-step="0">スタート</li>
      <li data-step="1">Gmail準備</li>
      <li data-step="2">予約サイト選択</li>
      <li data-step="3">LINEアカウント作成</li>
      <li data-step="4">トークン取得</li>
      <li data-step="5">スタッフ友だち追加</li>
      <li data-step="6">グループ作成(任意)</li>
      <li data-step="7">通知先ID取得</li>
      <li data-step="8">GASプロジェクト作成</li>
      <li data-step="9">6ファイル貼り付け</li>
      <li data-step="10">設定の自動生成</li>
      <li data-step="11">動作テスト</li>
      <li data-step="12">本番テスト</li>
      <li data-step="13">完了！</li>
    </ul>

    <div class="sidebar-foot">
      入力内容は自動保存されます<br>
      <button onclick="resetAll()">最初からやり直す</button>
    </div>
  </aside>

  <!-- ==== メイン ==== -->
  <main class="main">
    <div id="step-container"></div>
  </main>
</div>

<script>
// =============================================
// データ・状態管理
// =============================================
const STORAGE_KEY = 'hp_wizard_v1';
const state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
state.currentStep = state.currentStep || 0;
state.done = state.done || {};
state.lineToken = state.lineToken || '';
state.groupId = state.groupId || '';
state.salonName = state.salonName || '';
state.installerName = state.installerName || '';
state.gmailAddress = state.gmailAddress || '';
state.fromAddress = state.fromAddress || '';
state.contractPlan = state.contractPlan || 'light';

function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function resetAll() {
  if (confirm('すべての入力内容をリセットしますか？')) {
    localStorage.removeItem(STORAGE_KEY);
    location.reload();
  }
}

// =============================================
// GASコード（埋め込み・コピー対象）
// =============================================
const GAS_FILES = {
  'Config.gs': function(token, groupId, fromAddress, contractPlan) {
    const quotaByPlan = { light: 200, standard: 5000, pro: 30000 };
    const quota = quotaByPlan[contractPlan] || 200;
    const planLabel = { light: 'ライト', standard: 'スタンダードプレミアム', pro: 'プロ' }[contractPlan] || 'ライト';
    return `/**
 * 設定ファイル
 * 契約プラン: ${planLabel}
 * 対応予約サイト: ホットペッパー / 楽天ビューティー / minimo / EPARK Beauty
 */
const CONFIG = {
  LINE_CHANNEL_ACCESS_TOKEN: '${token || 'ここにLINEチャネルアクセストークンを貼る'}',

  LINE_TO_IDS: [
    '${groupId || 'ここに通知先IDを貼る'}'
  ],

  // 後方互換用: サイト別カレンダーが未設定のときに使う単一カレンダー
  CALENDAR_ID: 'primary',

  // サイト別カレンダー（推奨）
  // setupSiteCalendars() を1回実行すれば自動でカレンダーが作成され、IDが ScriptProperties に保存される
  // 手動で設定したい場合のみ以下に直接記入する（通常は空でOK）
  CALENDAR_IDS: {
    hotpepper: '',
    rakuten:   '',
    minimo:    '',
    epark:     '',
  },

  EVENT_TITLE_PREFIX: '【予約】',

  // 予約メールの送信元（空ならGMAIL_SEARCH_QUERYを使う / 複数はスペース区切り）
  FROM_ADDRESS: '${fromAddress || ''}',

  // FROM_ADDRESS が空のときに使うデフォルト検索クエリ（4予約サイト対応）
  GMAIL_SEARCH_QUERY: 'from:(salonboard.com OR beauty.hotpepper.jp OR rakuten.co.jp OR minimodel.jp OR epark.jp) is:unread newer_than:1d',

  PROCESSED_LABEL: 'HotPepper-処理済み',
  ERROR_LABEL: 'HotPepper-エラー',
  MAX_THREADS_PER_RUN: 20,

  // 月曜朝9時に週次ヘルスチェック通知をLINEに送る
  ENABLE_HEALTHCHECK: true,

  // LINE Messaging API のプラン上限（${planLabel}プランの月次上限）
  LINE_MONTHLY_QUOTA: ${quota},
  LINE_QUOTA_WARNING_RATIO: 0.75,

  // Skeleton本社（ベンダー）向けアラート送信先
  // 75%/100%到達時に裏でメール通知 → 本社が事前に気付いてプランアップを提案できる
  // サロン側からは見えないので、サロン体験は変わらない
  VENDOR_ALERT_EMAIL: 't3.5ty6@gmail.com',

  MAIN_FAILURE_THRESHOLD: 3,

  SALON_NAME: '',
};
`;
  },
  'Parser.gs': () => `/**
 * 予約メールパーサー（field-driven 統一アーキテクチャ）
 *
 * 設計原則:
 * 1. フィールド定義テーブル (FIELD_DEFS) で各フィールドのラベル候補と値パターンを宣言
 * 2. 統一エンジン (extractField) ですべて抽出。サイト別の個別ロジックなし
 * 3. 区切り文字を柔軟に: コロン全半角・】・[ ]・空白・改行・全角空白・ピリオドすべて吸収
 *    → 既知の3形式に同時対応:
 *      a) salonboard 形式: ■field\\n　value
 *      b) 楽天直送 形式:    【field】 value
 *      c) コロン形式:        field: value または field：value
 *
 * 後方互換: parseHotPepper / parseRakutenBeauty / parseMinimo / parseEpark を維持。
 * 内部ですべて統一エンジンを使う。
 *
 * 戻り値型 Reservation:
 *   {
 *     reservationNo: string,
 *     customerName:  string,
 *     startAt:       Date | null,
 *     durationMin:   number (default 60),
 *     menu:          string,
 *     staff:         string,
 *     phone:         string,
 *     note:          string,
 *     site:          'hotpepper' | 'rakuten' | 'minimo' | 'epark',
 *     isCancel:      boolean,
 *     isChange:      boolean,
 *     raw:           string
 *   }
 */

// 区切り文字パターン: フィールド名と値の間にあり得る文字をすべて吸収
//   . (period: 予約No. に対応)
//   \\s (whitespace: 半角/全角空白・改行・タブ)
//   : (半角コロン)
//   ：(全角コロン)
//   】(右レンチキュラーブラケット: 楽天直送形式)
//   ] (右角ブラケット: 念のため)
const FIELD_SEP = '[.\\\\s:：】\\\\]]*';

// 各フィールドの定義
//   labels:       探すフィールド名（左から順に試す。長い・特定的なものを先に置く）
//   valuePattern: 値の正規表現（キャプチャグループ1つ）
//   suffix:       値の後ろの追加パターン（任意）
//   flag:         追加の正規表現フラグ（任意）
const FIELD_DEFS = {
  reservationNo: {
    labels: ['予約番号', '受付番号', '予約ID', '受付ID', '予約No'],
    valuePattern: '([A-Za-z0-9_\\\\-]+)'
  },
  customerName: {
    // 長くて特定的なラベルから順に。「お客様」は最後（minimo）。
    labels: ['来店予定者名', 'お客様名', 'ご予約者', '氏\\\\s*名', 'お名前', 'お客様'],
    valuePattern: '([^\\\\n\\\\r]+?)',
    suffix: '\\\\s*様?\\\\s*$',
    flag: 'm'
  },
  startAt: {
    labels: ['ご予約日時', '予約日時', 'ご来店日時', '来店日時'],
    valuePattern: '([0-9]{4}[\\\\/年][0-9]{1,2}[\\\\/月][0-9]{1,2}日?[^\\\\n]*?[0-9]{1,2}[:：][0-9]{2})'
  },
  durationMin: {
    labels: ['所要時間目安', '所要時間'],
    valuePattern: '([0-9]+\\\\s*時間\\\\s*[0-9]*\\\\s*分?|[0-9]+\\\\s*分)'
  },
  menu: {
    labels: ['予約メニュー', 'ご予約メニュー', 'ご予約コース', '施術内容', 'メニュー', 'コース'],
    valuePattern: '([^\\\\n\\\\r]+)'
  },
  coupon: {
    // クーポン名はメニューが「その他」など総称的なとき施術内容として使う
    labels: ['ご利用クーポン', '利用クーポン', 'クーポン名', 'クーポン'],
    valuePattern: '([^\\\\n\\\\r]+)'
  },
  staff: {
    labels: ['指名スタッフ', '指名スタイリスト', '担当スタイリスト', 'スタイリスト', '担当者', '担当', '指名'],
    valuePattern: '([^\\\\n\\\\r]+)'
  },
  phone: {
    labels: ['お客様連絡先', 'お客様電話番号', '電話番号', '連絡先', 'TEL'],
    valuePattern: '([0-9\\\\-+\\\\s]+)'
  },
  note: {
    labels: ['ご要望・備考', 'ご要望・ご相談', 'ご要望', '備\\\\s*考', 'お客様メモ', '要望'],
    valuePattern: '([^\\\\n\\\\r]+)'
  }
};

/**
 * 統一フィールド抽出エンジン
 * body から該当フィールドの値を抽出。何も取れなければ空文字を返す。
 */
function extractField(body, def) {
  if (!body || typeof body !== 'string') return '';
  const suffix = def.suffix || '';
  const flag = def.flag || '';
  for (const label of def.labels) {
    const pattern = label + FIELD_SEP + def.valuePattern + suffix;
    let re;
    try {
      re = new RegExp(pattern, flag);
    } catch (e) {
      continue; // ラベル自体が壊れた正規表現なら次へ
    }
    const m = body.match(re);
    if (m && m[1] && m[1].trim()) return m[1].trim();
  }
  return '';
}

/**
 * 予約メールを解析。サイト判定 + 全フィールド抽出。
 */
function parseReservationEmail(subject, body, fromAddress) {
  const safeSubject = (typeof subject === 'string') ? subject : '';
  const safeBody    = (typeof body    === 'string') ? body    : '';
  const safeFrom    = (typeof fromAddress === 'string') ? fromAddress : '';

  const site = detectSite(safeSubject, safeBody, safeFrom);

  // 日時: フィールドラベル経由で取れなければ本文全体から救出
  let startAt = parseJaDateTime(extractField(safeBody, FIELD_DEFS.startAt));
  if (!startAt) startAt = parseStartAtFallback(safeBody);

  // メニュー: 「その他/他/指定なし/なし」など総称的な値ならクーポン名で補完
  let menu = extractField(safeBody, FIELD_DEFS.menu);
  const coupon = extractField(safeBody, FIELD_DEFS.coupon);
  if (coupon && /^(その他(?:メニュー)?|他|指定なし|なし|未指定)$/.test((menu || '').trim()) && !/^(利用クーポンなし|なし|未利用|未指定)$/.test(coupon.trim())) {
    menu = coupon;
  }

  const result = {
    reservationNo: extractField(safeBody, FIELD_DEFS.reservationNo),
    customerName:  extractField(safeBody, FIELD_DEFS.customerName).replace(/\\s*様\\s*$/, '').trim(),
    startAt:       startAt,
    durationMin:   60,
    menu:          menu,
    staff:         extractField(safeBody, FIELD_DEFS.staff),
    phone:         extractField(safeBody, FIELD_DEFS.phone),
    note:          extractField(safeBody, FIELD_DEFS.note),
    site:          site,
    isCancel:      detectCancel(safeSubject, safeBody),
    isChange:      detectChange(safeSubject, safeBody),
    raw:           safeBody
  };

  const durStr = extractField(safeBody, FIELD_DEFS.durationMin);
  if (durStr) result.durationMin = parseDurationMin(durStr);

  return result;
}

// 新規予約メールにも「キャンセル料/時/規定」等の定型注意書きが入るので
// 単純な /キャンセル|取消/ では新規が全部キャンセル扱いになる。
// subject は強いシグナル、body は明確な通知文言のみに限定する。
function detectCancel(subject, body) {
  if (/キャンセル|取消/.test(subject || '')) return true;
  return /(?:ご?予約).{0,6}(?:キャンセル|取消)|キャンセル.{0,3}(?:通知|完了|受付|されまし|され |いたしまし|手続|の.{0,3}お知らせ|です)|取消.{0,3}(?:通知|完了|受付|されまし|いたしまし)/.test(body || '');
}

function detectChange(subject, body) {
  if (/(?:予約).{0,3}(?:変更|修正)|(?:変更|修正).{0,3}(?:通知|完了|のお知らせ|されまし)/.test(subject || '')) return true;
  return /(?:ご?予約).{0,6}(?:変更|修正).{0,10}(?:通知|完了|されまし|いたしまし|のお知らせ|です)/.test(body || '');
}

// 日時抽出フォールバック: ラベル経由で取れなかったとき本文全体スキャン。
// 「予約受付日時」「送信日時」等の管理用タイムスタンプはスキップ。
function parseStartAtFallback(body) {
  if (!body) return null;
  const re = /(.{0,10})([0-9]{4}[\\/年][0-9]{1,2}[\\/月][0-9]{1,2}日?[^0-9\\n]{0,10}[0-9]{1,2}[:：][0-9]{2})/g;
  let m;
  while ((m = re.exec(body)) !== null) {
    const prefix = m[1] || '';
    if (/受付|送信|配信|連絡|発行|登録|更新|作成/.test(prefix)) continue;
    const d = parseJaDateTime(m[2]);
    if (d) return d;
  }
  return null;
}

/**
 * 件名・本文・送信元から予約サイトを判定
 */
function detectSite(subject, body, fromAddress) {
  const all = String((subject || '') + ' ' + (body || '') + ' ' + (fromAddress || '')).toLowerCase();
  if (/rakuten\\.co\\.jp|楽天ビューティ|楽天ビューティー/i.test(all))  return 'rakuten';
  if (/minimodel\\.jp|minimo|ミニモ/i.test(all))                     return 'minimo';
  if (/epark\\.jp|epark beauty/i.test(all))                          return 'epark';
  if (/salonboard\\.com|hotpepper|ホットペッパー/i.test(all))          return 'hotpepper';
  return 'hotpepper';
}

/**
 * 日本語混じり日時文字列を Date に変換
 *   "2026/05/02 (土) 14:00"  → Date(2026, 4, 2, 14, 0)
 *   "2026年5月10日(日) 11:30" → Date(2026, 4, 10, 11, 30)
 *   "2026年05月02日（）19:00" → Date(2026, 4, 2, 19, 0)  ※曜日空でもOK
 */
function parseJaDateTime(str) {
  if (!str || typeof str !== 'string') return null;
  const m = str.match(/([0-9]{4})[\\/年]([0-9]{1,2})[\\/月]([0-9]{1,2})日?[^0-9]*([0-9]{1,2})[:：]([0-9]{2})/);
  if (!m) return null;
  const [, y, mo, d, h, mi] = m.map(Number);
  return new Date(y, mo - 1, d, h, mi, 0);
}

/**
 * 「1時間30分」「90分」 → 90 (分)
 */
function parseDurationMin(str) {
  if (!str) return 60;
  let total = 0;
  const h = str.match(/([0-9]+)\\s*時間/);
  const m = str.match(/([0-9]+)\\s*分/);
  if (h) total += Number(h[1]) * 60;
  if (m) total += Number(m[1]);
  return total || 60;
}

// ============================================================
// 後方互換ラッパー
// 既存の呼び出し元（Diagnostics.gs など）が parseHotPepper 等を直接呼ぶケースに対応。
// 内部は統一エンジンを使い、site を強制上書きするだけ。
// ============================================================

function parseHotPepper(subject, body) {
  const r = parseReservationEmail(subject, body);
  r.site = 'hotpepper';
  return r;
}

function parseRakutenBeauty(subject, body) {
  const r = parseReservationEmail(subject, body);
  r.site = 'rakuten';
  return r;
}

function parseMinimo(subject, body) {
  const r = parseReservationEmail(subject, body);
  r.site = 'minimo';
  return r;
}

function parseEpark(subject, body) {
  const r = parseReservationEmail(subject, body);
  r.site = 'epark';
  return r;
}

// ============================================================
// 旧 matchOne / baseResult の互換 stub（万が一どこかから呼ばれていた場合用）
// ============================================================

function matchOne(text, patterns) {
  if (!text || typeof text !== 'string') return '';
  for (const re of patterns) {
    const m = text.match(re);
    if (m && m[1]) return m[1].trim();
  }
  return '';
}

function baseResult(body, site) {
  return {
    reservationNo: '', customerName: '', startAt: null,
    durationMin: 60, menu: '', staff: '', phone: '', note: '',
    site: site, isCancel: false, isChange: false, raw: body || ''
  };
}

    Logger.log('main() 全体失敗: ' + e.message);
    incrementMainFailureCount(e);
    throw e;
  }
}

function runMain() {
  const processedLabel = getOrCreateLabel(CONFIG.PROCESSED_LABEL);
  const errorLabel     = getOrCreateLabel(CONFIG.ERROR_LABEL);
  const threads = GmailApp.search(buildSearchQuery(), 0, CONFIG.MAX_THREADS_PER_RUN);
  for (const thread of threads) {
    if (hasLabel(thread, processedLabel)) continue;
    try {
      processThread(thread);
      thread.addLabel(processedLabel);
      thread.markRead();
    } catch (e) {
      Logger.log('処理失敗: ' + e.message);
      thread.addLabel(errorLabel);
      try { notifyLineError(e, thread); } catch (e2) {}
    }
  }
}

function incrementMainFailureCount(err) {
  const props = PropertiesService.getScriptProperties();
  const count = Number(props.getProperty('mainFailureCount') || '0') + 1;
  props.setProperty('mainFailureCount', String(count));
  if (count >= CONFIG.MAIN_FAILURE_THRESHOLD) {
    sendMainFailureWarning(count, err);
    props.deleteProperty('mainFailureCount');
  }
}

function sendMainFailureWarning(count, err) {
  const text = '🚨 ホットペッパー予約通知ツール 連続エラー\\n\\nmain()が ' + count + '回連続で失敗しました。\\n最新エラー: ' + err.message + '\\n\\n考えられる原因:\\n・LINEトークン期限切れ\\n・権限失効\\n・LINE/Google側障害\\n\\nGAS実行ログを確認するか本社サポートへ。';
  for (const toId of CONFIG.LINE_TO_IDS) {
    if (!toId || toId.indexOf('ここに') === 0) continue;
    try { pushLineMessageRaw(toId, text); } catch (e) { Logger.log('連続失敗警告送信失敗: ' + e.message); }
  }
}

function buildSearchQuery() {
  if (CONFIG.FROM_ADDRESS && CONFIG.FROM_ADDRESS.trim()) {
    const addrs = CONFIG.FROM_ADDRESS.trim().split(/[\\s,、]+/).filter(Boolean);
    // 複数アドレスは各々に from: を付ける（Gmail検索の仕様）
    const fromQuery = addrs.length > 1
      ? '(' + addrs.map(function(a) { return 'from:' + a; }).join(' OR ') + ')'
      : 'from:' + addrs[0];
    return fromQuery + ' is:unread newer_than:1d';
  }
  return CONFIG.GMAIL_SEARCH_QUERY;
}

// 検証用クエリ: is:unread を外し newer_than:7d まで遡る
// （テストメールを開いた瞬間に既読化されて拾えない事故を防ぐ）
function buildTestSearchQuery() {
  if (CONFIG.FROM_ADDRESS && CONFIG.FROM_ADDRESS.trim()) {
    const addrs = CONFIG.FROM_ADDRESS.trim().split(/[\\s,、]+/).filter(Boolean);
    const fromQuery = addrs.length > 1
      ? '(' + addrs.map(function(a) { return 'from:' + a; }).join(' OR ') + ')'
      : 'from:' + addrs[0];
    return fromQuery + ' newer_than:7d';
  }
  const base = (CONFIG.GMAIL_SEARCH_QUERY || '')
    .replace(/\\bis:unread\\b/gi, '')
    .replace(/\\bnewer_than:\\d+[dhm]\\b/gi, '')
    .replace(/\\s+/g, ' ')
    .trim();
  return (base ? base + ' ' : '') + 'newer_than:7d';
}

function processThread(thread) {
  const messages = thread.getMessages();
  const msg = messages[messages.length - 1];
  const reservation = parseReservationEmail(msg.getSubject() || '', msg.getPlainBody() || '', msg.getFrom() || '');
  // 予約と判定できないメール（お知らせ等）はスキップ
  if (!reservation.startAt && !reservation.customerName && !reservation.reservationNo) {
    Logger.log('予約と判定できないメールのためスキップ');
    return;
  }
  notifyLine(reservation);
  registerCalendar(reservation);
}

function getOrCreateLabel(name) {
  return GmailApp.getUserLabelByName(name) || GmailApp.createLabel(name);

function hasLabel(thread, label) {
  return thread.getLabels().some(l => l.getName() === label.getName());
}

function notifyLineError(err, thread) {

  for (const toId of CONFIG.LINE_TO_IDS) {

    usageRatio >= 75 ? '⚠️ 上限が近づいています。プランアップ検討を。' : '・残り余裕あり',

 * という現象に対処する。
 *
 * 削除されるのは「-- サロン予約一元通知ツール 自動登録 --」が説明文に
 * 含まれる過去30日 〜 未来90日のイベントのみ。
 */
function cleanupPrimaryCalendarStrayEvents() {
  Logger.log('========================================');
  Logger.log('  primary カレンダーから自動登録イベントを掃除');
  Logger.log('========================================\\n');

  const cal = CalendarApp.getDefaultCalendar();
  if (!cal) {
    Logger.log('❌ primary カレンダーにアクセスできません');
    return;
  }
  Logger.log('対象カレンダー: ' + cal.getName());

  const now = new Date();
  const fromDate = new Date(now.getTime() - 30 * 24 * 3600 * 1000);
  const toDate   = new Date(now.getTime() + 90 * 24 * 3600 * 1000);
  const events = cal.getEvents(fromDate, toDate);

  let deleted = 0;
  events.forEach(function(ev) {
    const desc = ev.getDescription() || '';
    if (desc.indexOf('サロン予約一元通知ツール') >= 0) {
      Logger.log('削除: ' + ev.getTitle() + ' (' + ev.getStartTime().toLocaleString('ja-JP') + ')');
      ev.deleteEvent();
      deleted++;
    }
  });

  Logger.log('');
  Logger.log('✅ ' + deleted + '件のイベントを primary から削除しました。');
  Logger.log('   この後 diagnoseAllSites() を再度実行すれば、正しいサイト別カレンダーに登録されます。');
}

/**
 * Gmail から最近の予約メール候補を取り出して、それぞれをパーサーに通し、
 * 「何が取れて何が取れなかったか」を実行ログに表示する。
 *
 * 使い時:
 *   「メール来てるのにLINE/カレンダーが反映されない」と感じた時、
 *   このメールでパーサーが何を抽出できたかを実環境で確認する。
 *
 * 取得範囲: 過去3日以内・予約サイト系の送信元（CONFIG.GMAIL_SEARCH_QUERY 相当） / 最大5件
 *
 * 注意:
 *   - 既読/未読・処理済みラベル問わず、最近のメールを舐める
 *   - メール内容は実行ログに表示されるので機微情報含む可能性あり
 */
function diagnoseRecentEmails() {
  Logger.log('========================================');
  Logger.log('  実環境メール診断（過去3日 / 最大5件）');
  Logger.log('========================================\\n');

  // 4予約サイト系の送信元を広めに探す（is:unread / 処理済み問わず）
  const query = 'from:(salonboard.com OR beauty.hotpepper.jp OR rakuten.co.jp OR minimodel.jp OR epark.jp) newer_than:3d';
  Logger.log('検索クエリ: ' + query);

  const threads = GmailApp.search(query, 0, 5);
  Logger.log('ヒット: ' + threads.length + '件\\n');

  if (threads.length === 0) {
    Logger.log('該当メールなし。検索クエリを広めに直すか、デモ予約を入れてからもう一度実行してください。');
    return;
  }

  threads.forEach(function(thread, i) {
    const msg = thread.getMessages()[thread.getMessages().length - 1];
    const subject = msg.getSubject() || '';
    const body    = msg.getPlainBody() || '';
    const from    = msg.getFrom() || '';

    Logger.log('--- [' + (i + 1) + '] ' + subject + ' ---');
    Logger.log('  From: ' + from);
    Logger.log('  Date: ' + msg.getDate().toLocaleString('ja-JP'));

    let r;
    try {
      r = parseReservationEmail(subject, body, from);
    } catch (e) {
      Logger.log('  ❌ パーサーエラー: ' + e.message);
      return;
    }

    Logger.log('  検知サイト:    ' + r.site);
    Logger.log('  予約番号:      ' + (r.reservationNo || '⚠️ 取得失敗'));
    Logger.log('  お客様名:      ' + (r.customerName  || '⚠️ 取得失敗'));
    Logger.log('  予約日時:      ' + (r.startAt ? r.startAt.toLocaleString('ja-JP') : '⚠️ 取得失敗'));
    Logger.log('  所要時間:      ' + r.durationMin + '分');
    Logger.log('  メニュー:      ' + (r.menu  || '(なし)'));
    Logger.log('  担当:          ' + (r.staff || '(なし)'));
    Logger.log('  電話番号:      ' + (r.phone || '(なし)'));
    Logger.log('  備考:          ' + (r.note  || '(なし)'));
    Logger.log('  キャンセル:    ' + r.isCancel);
    Logger.log('  変更:          ' + r.isChange);

    // パイプライン挙動の予測
    const willSkip = !r.startAt && !r.customerName && !r.reservationNo;
    const willLine = !willSkip;
    const willCal  = !willSkip && !!r.startAt;
    Logger.log('  → LINE通知:    ' + (willLine ? '送信される' : '⏭ スキップ（予約と判定できない）'));
    Logger.log('  → カレンダー:  ' + (willCal  ? '登録される'  : '⏭ スキップ' + (!r.startAt ? '（日時取得失敗）' : '')));

    Logger.log('');
  });

  Logger.log('💡 ⚠️取得失敗 が出ているフィールドがあれば、本社サポートにこの実行ログのスクショを送付してください。');
  Logger.log('   メール本文の形式を確認して Parser.gs を更新します。');
}

/**
 * ツール全体の健康診断。
 * 設定の漏れや権限エラーを一覧で確認できる。
 */
function quickSelfCheck() {
  Logger.log('========================================');
  Logger.log('  ヘルスチェック');
  Logger.log('========================================\\n');

  const checks = [];

  // 1. 必須CONFIG
  checks.push(['LINE_TOKEN',  !!CONFIG.LINE_TOKEN && CONFIG.LINE_TOKEN.indexOf('ここに') < 0]);
  checks.push(['LINE_TO_IDS', Array.isArray(CONFIG.LINE_TO_IDS) && CONFIG.LINE_TO_IDS.length > 0]);

  // 2. Gmail検索クエリ
  let q = '';
  try { q = buildSearchQuery(); } catch (e) { q = '(エラー: ' + e.message + ')'; }
  checks.push(['Gmail検索クエリ', q.length > 0]);
  Logger.log('現在のGmail検索クエリ:\\n  ' + q + '\\n');

  // 3. パーサー
  let parserOK = true;
  try {
    const r = parseReservationEmail(
      DIAG_FIXTURES.hotpepper.subject,
      DIAG_FIXTURES.hotpepper.body,
      DIAG_FIXTURES.hotpepper.from
    );
    parserOK = r.site === 'hotpepper' && !!r.customerName;
  } catch (e) { parserOK = false; }
  checks.push(['パーサー(ホッペ)', parserOK]);

  // 4. カレンダーアクセス
  let calOK = true;
  try {
    const id = resolveCalendarId('hotpepper');
    const cal = CalendarApp.getCalendarById(id);
    calOK = !!cal;
  } catch (e) { calOK = false; }
  checks.push(['カレンダーアクセス', calOK]);

  // 結果表示
  Logger.log('項目              結果');
  checks.forEach(function(c) {
    Logger.log(pad(c[0], 18) + (c[1] ? '✅' : '❌'));
  });
  Logger.log('');

  const allOK = checks.every(function(c) { return c[1]; });
  if (allOK) {
    Logger.log('🎉 すべて OK。診断テストを実行してみる: diagnoseAllSites()');
  } else {
    Logger.log('⚠️  ❌ がある項目を先に修正してください。');
  }
}
`,
};

      else if (id === 'input-installer') state.installerName = el.value;
      else if (id === 'input-gmail') state.gmailAddress = el.value.trim();
      else if (id === 'input-from-address') state.fromAddress = el.value.trim();
      save();
    });
  });

  // STEP 2: 独立した4入力欄でのサイト送信元設定
  const siteRowCheckboxes = document.querySelectorAll('.site-row input[type=checkbox][data-site]');
  if (siteRowCheckboxes.length > 0) {
    const siteInputs = document.querySelectorAll('.site-row .site-input[data-site-input]');
    const previewEl = document.getElementById('preview-combined');

    const updatePreview = () => {
      const parts = [];
      siteRowCheckboxes.forEach(cb => {
        if (!cb.checked) return;
        const site = cb.dataset.site;
        const inp = document.querySelector('.site-input[data-site-input="' + site + '"]');
        if (inp && inp.value.trim()) parts.push(inp.value.trim());
      });
      const combined = parts.join(' ').trim();
      if (previewEl) {
        previewEl.textContent = combined || '(チェックされたサイトがありません)';
      }
      // siteAddrs を state に保存（編集値を記憶）
      state.siteAddrs = {};
      siteInputs.forEach(inp => {
        state.siteAddrs[inp.dataset.siteInput] = inp.value;
      });
      save();
    };

    siteRowCheckboxes.forEach(cb => {
      cb.addEventListener('change', () => {
        const row = cb.closest('.site-row');
        if (row) row.classList.toggle('checked', cb.checked);
        updatePreview();
      });
    });

    siteInputs.forEach(inp => {
      inp.addEventListener('input', () => {
        inp.classList.add('flash');
        setTimeout(() => inp.classList.remove('flash'), 400);
        updatePreview();
      });
    });

    // 初期表示時にプレビュー更新
    updatePreview();
  }

  validateToken();
  validateGroupId();
  updateSidebar();
}

function validateToken() {
  const el = document.getElementById('input-token');
  const hint = document.getElementById('token-hint');
  if (!el) return;
  if (!el.value) { el.className = ''; if (hint) hint.className='input-hint'; return; }
  if (el.value.length < 30) {
    el.className = 'invalid';
    if (hint) { hint.textContent = '⚠️ トークンが短すぎます。コピー漏れの可能性'; hint.className='input-hint error'; }
  } else {
    el.className = 'valid';
    if (hint) { hint.textContent = '✓ トークンが入力されました ('+el.value.length+'文字)'; hint.className='input-hint'; }
  }
}

function validateGroupId() {
  const el = document.getElementById('input-groupid');
  const hint = document.getElementById('groupid-hint');
  if (!el) return;
  if (!el.value) { el.className = ''; if (hint) hint.className='input-hint'; return; }
  if (!/^[CU][a-f0-9]{20,}$/i.test(el.value)) {
    el.className = 'invalid';
    if (hint) { hint.textContent = '⚠️ 形式が違う可能性。C(グループ)またはU(個人)で始まる長い文字列のはずです'; hint.className='input-hint error'; }
  } else {
    el.className = 'valid';
    const kind = el.value.startsWith('C') ? 'グループID' : '個人ユーザーID';
    if (hint) { hint.textContent = '✓ ' + kind + 'が正しく入力されました'; hint.className='input-hint'; }
  }
}

function updateSidebar() {
  const total = STEPS.length;
  const pct = (state.currentStep / (total - 1)) * 100;
  document.getElementById('progress-bar').style.width = pct + '%';

  document.querySelectorAll('#step-list li').forEach(li => {
    const step = Number(li.dataset.step);
    li.classList.toggle('active', step === state.currentStep);
    li.classList.toggle('done', step < state.currentStep);
    li.onclick = () => { state.currentStep = step; save(); render(); window.scrollTo(0,0); };
  });
}

function goNext() {
  if (state.currentStep < STEPS.length - 1) {
    state.currentStep++;
    save();
    render();
    window.scrollTo(0,0);
  }
}

// STEP 2 専用: サイト別入力をまとめて state.fromAddress に保存してから次へ
function commitSiteAddrsAndNext() {
  const checkboxes = document.querySelectorAll('.site-row input[type=checkbox][data-site]');
  const parts = [];
  state.siteAddrs = state.siteAddrs || {};
  checkboxes.forEach(cb => {
    const site = cb.dataset.site;
    const inp = document.querySelector('.site-input[data-site-input="' + site + '"]');
    if (inp) state.siteAddrs[site] = inp.value;
    if (cb.checked && inp && inp.value.trim()) parts.push(inp.value.trim());
  });
  state.fromAddress = parts.join(' ').trim();
  save();
  goNext();
}

function goPrev() {
  if (state.currentStep > 0) {
    state.currentStep--;
    save();
    render();
    window.scrollTo(0,0);
  }
}

function showFile(name) {
  document.querySelectorAll('#file-tabs button').forEach(b => b.classList.toggle('active', b.dataset.file === name));
  ['Config.gs','Parser.gs','Line.gs','Calendar.gs','Main.gs','Diagnostics.gs'].forEach(n => {
    const el = document.getElementById('file-' + n);
    if (el) el.classList.toggle('hidden', n !== name);
  });
}

function copyCode(elementId, btn) {
  const text = document.getElementById(elementId).textContent;
  navigator.clipboard.writeText(text).then(() => {
    const orig = btn.innerHTML;
    btn.innerHTML = '✓ コピー完了';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.innerHTML = orig;
      btn.classList.remove('copied');
    }, 2000);
  }).catch(err => {
    alert('コピーに失敗しました。手動で選択してコピーしてください');
  });
}

// アップデート用: GAS_FILES から直接生成したコードをクリップボードへ
function copyLatestFile(fileName, btn) {
  const code = GAS_FILES[fileName](state.lineToken, state.groupId, state.fromAddress, state.contractPlan);
  navigator.clipboard.writeText(code).then(() => {
    const orig = btn.innerHTML;
    btn.innerHTML = '✓ コピーした！次はGASで貼り付け';
    btn.style.background = '#15803d';
    setTimeout(() => {
      btn.innerHTML = orig;
      btn.style.background = '';
    }, 3000);
  }).catch(err => {
    alert('コピーに失敗しました。STEP 9 の該当タブから手動でコピーしてください');
  });
}

// =============================================
// 起動
// =============================================
render();
</script>
